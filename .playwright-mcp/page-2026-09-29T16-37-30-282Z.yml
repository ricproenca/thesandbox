      - generic [ref=f683e261]:
        - heading "A note for students & parents" [level=3] [ref=f683e262]
        - paragraph [ref=f683e263]: Please read — important information about how the club works.
        - generic [ref=f683e264]:
          - paragraph [ref=f683e265]: The Sandbox is a voluntary, co-curricular activity. Participation is entirely optional and carries no academic grade or formal assessment. Students are free to join, take a break, or leave at any time.
          - paragraph [ref=f683e266]: All software used in the club is free, browser-based, or school-licensed. Students are never required to purchase tools, subscriptions, or hardware. Where personal devices (Arduino, Raspberry Pi, etc.) are brought in voluntarily, the school accepts no liability for loss or damage.
          - paragraph [ref=f683e267]:
            - text: "AI tools are used as professional learning aids under the club's explicit policy:"
            - strong [ref=f683e268]: you may use AI on any project — if you can explain the output.
            - text: Students are taught to verify, question, and understand AI-generated code rather than treat it as an answer.
          - paragraph [ref=f683e269]: The end-of-year showcase is open to all students and families. Work displayed is shared with the student's explicit consent. No personal data from student projects is stored, shared, or published by the school without parental consent where required.
