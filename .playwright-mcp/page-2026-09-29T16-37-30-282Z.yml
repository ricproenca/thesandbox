      - generic [ref=f683e145]: How it works
      - heading [level=2] [ref=f683e146]:
        - text: Every session followsthe same
        - emphasis [ref=f683e147]: rhythm.
      - paragraph [ref=f683e148]: Two hours. Five moments. No lectures, no homework, no grades — just structured time to build.
      - generic [ref=f683e149]:
        - generic [ref=f683e152]:
          - generic [ref=f683e153]:
            - generic [ref=f683e154]: "1"
            - generic [ref=f683e155]: 0–10 min
            - heading "Stand-up circle" [level=3] [ref=f683e156]
            - paragraph [ref=f683e157]: What I'm building, what I did, what I'll do today. Thirty seconds each.
          - generic [ref=f683e158]:
            - generic [ref=f683e159]: "2"
            - generic [ref=f683e160]: 10–80 min
            - heading "Build time" [level=3] [ref=f683e161]
            - paragraph [ref=f683e162]: "Work independently. Guide circulates. Rule: never touch their keyboard."
          - generic [ref=f683e163]:
            - generic [ref=f683e164]: "3"
            - generic [ref=f683e165]: 80–95 min
            - heading "Spark session" [level=3] [ref=f683e166]
            - paragraph [ref=f683e167]: "Lost? Open the gallery together. One question: what made you want to click?"
          - generic [ref=f683e168]:
            - generic [ref=f683e169]: "4"
            - generic [ref=f683e170]: 95–105 min
            - heading "Commit check" [level=3] [ref=f683e171]
            - paragraph [ref=f683e172]: "\"By next session I will have ___.\" One sentence. One demonstrable thing."
          - generic [ref=f683e173]:
            - generic [ref=f683e174]: "5"
            - generic [ref=f683e175]: 105–120 min
            - heading "Show and tell" [level=3] [ref=f683e176]
            - paragraph [ref=f683e177]: One student shares their screen — working or broken. Questions from the group only.
        - generic [ref=f683e178]:
          - heading "How students get unstuck" [level=3] [ref=f683e179]
          - paragraph [ref=f683e180]: Before a student can ask the teacher for help, they work through four layers in order. AI sits at Layer 3 — a professional tool, not a first resort.
          - table [ref=f683e182]:
            - rowgroup [ref=f683e183]:
              - row [ref=f683e184]:
                - columnheader "Layer" [ref=f683e185]
                - columnheader "Source" [ref=f683e186]
                - columnheader "How to use it" [ref=f683e187]
            - rowgroup [ref=f683e188]:
              - row [ref=f683e189]:
                - cell "1" [ref=f683e190]
                - cell "Yourself" [ref=f683e191]
                - cell "Read the error. Google it. Try one fix. Spend at least 10 minutes before moving on." [ref=f683e192]
              - row [ref=f683e193]:
                - cell "2" [ref=f683e194]
                - cell "A peer" [ref=f683e195]
                - cell "Describe the problem out loud to another student. Most bugs get solved in this step." [ref=f683e196]
              - row [ref=f683e197]:
                - cell "3" [ref=f683e198]
                - cell "AI tools" [ref=f683e199]
                - cell "Claude, ChatGPT, Copilot. Paste the error and your code. Read and understand the answer before applying." [ref=f683e200]
              - row [ref=f683e201]:
                - cell "4" [ref=f683e202]
                - cell "The teacher" [ref=f683e203]
                - cell "Can ask after layers 1–3. Explain what you tried and what the AI said." [ref=f683e204]
