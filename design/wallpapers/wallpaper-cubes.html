<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Wallpaper: Cubes and ring</title>
<link rel="stylesheet" href="../posters/poster.css" />
<link rel="stylesheet" href="wallpaper.css" />
<style>
  .glow { width: 1300px; height: 1300px; background: radial-gradient(circle, rgba(28, 197, 202, 0.30), rgba(28, 197, 202, 0.06) 45%, transparent 70%); }
  .art { position: absolute; left: 50%; top: 50%; width: 1120px; height: 1044px; transform: translate(-50%, -52%); }
</style>
</head>
<body>
<div class="wall">
  <div class="grid-bg"></div>
  <div class="glow"></div>

  <svg class="art" viewBox="0 0 880 820" aria-hidden="true">
    <defs>
      <symbol id="cube-teal" viewBox="-87 -100 174 200"><polygon points="0,-100 86.6,-50 0,0 -86.6,-50" fill="#7eeef0"/><polygon points="-86.6,-50 0,0 0,100 -86.6,50" fill="#1cc5ca"/><polygon points="86.6,-50 0,0 0,100 86.6,50" fill="#1285a4"/></symbol>
      <symbol id="cube-orange" viewBox="-87 -100 174 200"><polygon points="0,-100 86.6,-50 0,0 -86.6,-50" fill="#ffc08f"/><polygon points="-86.6,-50 0,0 0,100 -86.6,50" fill="#f77924"/><polygon points="86.6,-50 0,0 0,100 86.6,50" fill="#b9540f"/></symbol>
      <symbol id="cube-wire" viewBox="-89 -102 178 204"><g fill="none" stroke="#1cc5ca" stroke-opacity="0.6" stroke-width="5" stroke-linejoin="round"><polygon points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50"/><path d="M-86.6,-50 L0,0 L86.6,-50 M0,0 L0,100"/></g></symbol>
    </defs>
    <circle cx="440" cy="410" r="300" fill="none" stroke="#1cc5ca" stroke-opacity="0.6" stroke-width="3" />
    <circle cx="440" cy="410" r="370" fill="none" stroke="#1cc5ca" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="5 14" />
    <g fill="none" stroke="#1cc5ca" stroke-opacity="0.4" stroke-width="2.5">
      <path d="M20 220 H170 L220 270 H300" />
      <path d="M860 560 H730 L680 610 H600" />
      <path d="M60 690 L130 620 H240" />
      <path d="M840 110 L790 160 H690" />
    </g>
    <g fill="#1cc5ca"><circle cx="20" cy="220" r="7"/><circle cx="860" cy="560" r="7"/><circle cx="60" cy="690" r="7"/><circle cx="840" cy="110" r="7"/></g>
    <g font-family="DM Mono, monospace" font-size="44" fill="#1cc5ca" fill-opacity="0.5">
      <text x="70" y="430">&lt;/&gt;</text>
      <text x="720" y="400">{ }</text>
      <text x="660" y="760" fill="#f77924" fill-opacity="0.8">&lt;&gt;</text>
    </g>
    <use href="#cube-wire" x="630" y="560" width="130" height="150" />
    <use href="#cube-wire" x="230" y="110" width="84" height="97" />
    <use href="#cube-teal" x="290" y="210" width="300" height="345" />
    <use href="#cube-orange" x="620" y="130" width="150" height="172" />
    <use href="#cube-teal" x="170" y="500" width="116" height="133" />
    <use href="#cube-orange" x="330" y="190" width="64" height="74" />
  </svg>

  <div class="corner-brand"><img src="../../public/assets/logo/sandbox_logo.png" alt="" />The Sandbox</div>
  <div class="corner-scan"><img class="qr" src="../../public/assets/posters/qrcode.png" alt="" /><span>Scan to join</span></div>
  <div class="pc-note">Please don&rsquo;t turn off the PC</div>
</div>
</body>
</html>
