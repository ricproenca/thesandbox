<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Wallpaper: Where ideas take shape</title>
<link rel="stylesheet" href="../posters/poster.css" />
<style>
  /* The original artwork (source/wallpaper_ideas_original.jpg, 2400×1792) with the
     QR code overlaid in the dark bottom-right corner. Rendered at 1×. */
  .wall {
    width: 2400px;
    height: 1792px;
    position: relative;
    overflow: hidden;
    background: url("source/wallpaper_ideas_original.jpg") center / cover no-repeat;
  }
  /* bottom: 260px keeps it inside the 16:9 area, so it survives "Fill" on widescreen monitors */
  .scan { position: absolute; right: 90px; bottom: 260px; text-align: center; }
  .scan .qr { width: 200px; height: 200px; border-radius: 14px; }
  .scan span { display: block; font-family: var(--mono); font-size: 19px; letter-spacing: 0.12em; text-transform: uppercase; color: #fff; margin-top: 14px; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6); }
</style>
</head>
<body>
<div class="wall">
  <div class="scan"><img class="qr" src="../../public/assets/posters/qrcode.png" alt="" /><span>Scan to join</span></div>
</div>
</body>
</html>
