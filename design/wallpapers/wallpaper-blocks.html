<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Wallpaper: Block pile</title>
<link rel="stylesheet" href="../posters/poster.css" />
<link rel="stylesheet" href="wallpaper.css" />
<style>
  .wall { background: var(--navy-deep); }
  .glow { width: 1400px; height: 1400px; background: radial-gradient(circle, rgba(247, 121, 36, 0.14), rgba(28, 197, 202, 0.10) 40%, transparent 70%); }
  /* the pile is generated on a true isometric grid (see README) */
  .pile { position: absolute; left: 50%; top: 50%; width: 900px; height: 900px; transform: translate(-50%, -54%); }
</style>
</head>
<body>
<div class="wall">
  <div class="grid-bg"></div>

  <svg class="pile" viewBox="0 -60 900 900" aria-hidden="true">

      <symbol id="c-orange" viewBox="-87 -100 174 200"><polygon points="0,-100 86.6,-50 0,0 -86.6,-50" fill="#ffc08f"/><polygon points="-86.6,-50 0,0 0,100 -86.6,50" fill="#f77924"/><polygon points="86.6,-50 0,0 0,100 86.6,50" fill="#b9540f"/></symbol>

</html>
